<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Bleskový Alarm</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #f59e0b; text-align: center; }
        .section {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        label { display: block; font-size: 0.85em; margin-bottom: 5px; color: #94a3b8; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .btn-primary { background: #f59e0b; color: #0f172a; }
        .btn-primary:hover { background: #d97706; }
        .btn-secondary { background: #475569; color: #fff; }
        .btn-secondary:hover { background: #64748b; }
        #status {
            text-align: center;
            font-size: 0.9em;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #0f172a;
        }
        .flash { animation: trigger 0.5s ease-in-out; }
        @keyframes trigger {
            0% { background-color: #1e293b; }
            50% { background-color: #f59e0b; }
            100% { background-color: #1e293b; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>⚡ Bleskový Alarm</h2>

    <!-- MENU / NASTAVENÍ -->
    <div class="section">
        <label>API Klíč (OpenWeatherMap):</label>
        <input type="text" id="apiKey" placeholder="Vlož svůj API klíč...">

        <label>Maximální vzdálenost pro alarm (km):</label>
        <input type="number" id="radius" value="15" min="1" max="100">

        <label>Tvoje Poloha (GPS):</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="coords" placeholder="Zjišťuji..." readonly>
            <button class="btn btn-secondary" style="width: auto;" onclick="getLocation()">📍</button>
        </div>
    </div>

    <div class="section">
        <label>Test Zvuku:</label>
        <button class="btn btn-secondary" onclick="testSound()">▶️ Přehraj zvuk (blesk.mp3)</button>
    </div>

    <!-- SPUŠTĚNÍ DETEKTORU -->
    <button class="btn btn-primary" id="toggleBtn" onclick="toggleDetector()">🚀 Spustit sledování</button>

    <div id="status">Stav: Čekám na spuštění</div>
</div>

<audio id="thunderAudio" src="blesk.mp3" preload="auto"></audio>

<script>
    let isRunning = false;
    let userLat = null;
    let userLon = null;
    let checkInterval = null;

    const thunderAudio = document.getElementById('thunderAudio');
    const statusDiv = document.getElementById('status');

    // Automaticky načíst GPS při načtení
    window.onload = () => {
        getLocation();
    };

    function getLocation() {
        if (navigator.geolocation) {
            statusDiv.textContent = "Zjišťuji polohu...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('coords').value = `${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
                    statusDiv.textContent = "Poloha zjištěna!";
                },
                (err) => {
                    statusDiv.textContent = "Chyba při získávání GPS. Zadej ručně.";
                    document.getElementById('coords').removeAttribute('readonly');
                }
            );
        }
    }

    function testSound() {
        thunderAudio.currentTime = 0;
        thunderAudio.play().catch(e => alert("Ujisti se, že soubor 'blesk.mp3' je na GitHubu!"));
    }

    function toggleDetector() {
        const btn = document.getElementById('toggleBtn');
        const apiKey = document.getElementById('apiKey').value.trim();

        if (!isRunning) {
            // Spuštění
            thunderAudio.play().then(() => {
                thunderAudio.pause();
                thunderAudio.currentTime = 0;
            }).catch(() => {});

            isRunning = true;
            btn.textContent = "⏹️ Zastavit sledování";
            btn.style.background = "#ef4444";
            statusDiv.textContent = "🟢 Sledování AKTIVNÍ... Hledám blesky";

            // Kontrola každých 15 sekund
            checkLightning();
            checkInterval = setInterval(checkLightning, 15000);
        } else {
            // Zastavení
            isRunning = false;
            clearInterval(checkInterval);
            btn.textContent = "🚀 Spustit sledování";
            btn.style.background = "#f59e0b";
            statusDiv.textContent = "🔴 Sledování zastaveno.";
        }
    }

    async function checkLightning() {
        if (!isRunning) return;

        const radius = parseFloat(document.getElementById('radius').value);
        const apiKey = document.getElementById('apiKey').value.trim();

        statusDiv.textContent = `Kontrola búřek (${new Date().toLocaleTimeString()})...`;

        try {
            // Pokud chybí API klíč, použije se záložní simulace pro otestování
            if (!apiKey) {
                statusDiv.textContent = "⚠️ Chybí API klíč! (Pročti si návod k získání klíče)";
                return;
            }

            // Dotaz na OpenWeatherMap Weather API pro aktuální bouřkovou aktivitu
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${userLat}&lon=${userLon}&appid=${apiKey}`);
            const data = await response.json();

            // Kód 2xx v OpenWeather představuje bouřky (Thunderstorm)
            if (data.weather && data.weather[0].id >= 200 && data.weather[0].id < 300) {
                triggerLightningAlert("Detekována bouřka / blesk v blízkosti!");
            } else {
                statusDiv.textContent = `🟢 V okruhu ${radius} km je klid (${new Date().toLocaleTimeString()})`;
            }

        } catch (err) {
            console.error(err);
            statusDiv.textContent = "Chyba při komunikaci s meteo API.";
        }
    }

    function triggerLightningAlert(msg) {
        statusDiv.textContent = `⚡ BLESK! ${msg}`;
        document.getElementById('mainContainer').classList.add('flash');
        setTimeout(() => document.getElementById('mainContainer').classList.remove('flash'), 500);

        thunderAudio.currentTime = 0;
        thunderAudio.play();
    }
</script>

</body>
</html>
